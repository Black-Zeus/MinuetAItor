[pytest]
minversion = 8.0
testpaths =
    Testing/backend-api
python_files =
    test_*.py
python_classes =
    Test*
python_functions =
    test_*
addopts =
    -ra
    --strict-markers
    --junitxml=Testing/reports/backend-api-junit.xml
markers =
    smoke: pruebas rapidas de disponibilidad y flujos base
    rbac: pruebas de autenticacion, autorizacion y scopes
    contract: pruebas de contrato HTTP y estructura de respuesta
    requires_admin: requiere QA_ADMIN_CREDENTIAL y QA_ADMIN_PASSWORD
